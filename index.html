<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>Hourberry Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Baloo+2:wght@700;800&display=swap">
<style>
/* Layout: screen index on the left, a 390×844 grayscale phone in the middle; on phones the index folds into a drawer */
:root{
  --page:#eceaf0; --panel:#ffffff; --ink:#17151d; --muted:#6c6878; --line:#d9d6e0; --accent:#6b4ef0;
  --sans:"Inter",system-ui,sans-serif; --mono:var(--sans);
  /* wireframe palette: white, black, two grays (fixed on purpose) */
  --W:#ffffff; --K:#000000; --G1:#ededed; --G2:#8c8c8c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#121117;--panel:#1b1a22;--ink:#ecebf2;--muted:#9e9aab;--line:#2e2c38;--accent:#a593ff;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121117;--panel:#1b1a22;--ink:#ecebf2;--muted:#9e9aab;--line:#2e2c38;--accent:#a593ff;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;box-sizing:border-box}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);gap:24px;height:100%;max-width:1200px;margin:0 auto}
.side{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;overflow:auto;min-width:0;display:flex;flex-direction:column;gap:14px}
.side h1{font-size:18px;margin:0;font-weight:700}
.side .sub{color:var(--muted);font-size:13px;margin:0;line-height:1.45}
.side .grp{font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 4px;padding:0 8px}
.notes:empty{display:none}
.side .list{display:flex;flex-direction:column;gap:2px}
.side .list button{text-align:left;font-size:13px;padding:6px 8px;border-radius:7px;display:flex;gap:8px}
.side .list button span{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;padding-top:1px}
.side .list button:hover{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.side .list button.cur{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.side .ctrls{display:flex;flex-wrap:wrap;gap:6px}
.side .ctrls button{font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:8px}
.side .ctrls button.on{border-color:var(--accent);color:var(--accent)}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;min-height:0}
.where{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:center}
.where b{color:var(--ink);font-weight:500}
.fit{position:relative}
.menu-btn{display:none}
@media (max-width:760px){
  body{padding-block:8px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:50;border-radius:0 14px 14px 0;transform:translateX(-105%);transition:transform .25s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  .side.open{transform:none}
  .menu-btn{display:inline-flex;font-size:12px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
}
/* ---------- phone (wireframe world) ---------- */
.phone{width:390px;height:844px;background:var(--W);color:var(--K);border-radius:46px;box-shadow:0 0 0 10px #111,0 20px 60px rgba(0,0,0,.25);position:relative;overflow:hidden;transform-origin:top left;font-family:var(--sans)}
.view{position:absolute;inset:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--W)}
.sb{display:flex;justify-content:space-between;align-items:center;padding:16px 28px 8px 36px;font-weight:600;font-size:16px;flex:none}
.sb .bat{display:flex;gap:6px;align-items:center;font-size:13px}.sb .bat i{width:24px;height:12px;border-radius:3px;background:var(--K);display:block}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}
.foot{flex:none}
.hi{flex:none;display:flex;justify-content:center;padding:8px 0}.hi i{width:134px;height:5px;border-radius:3px;background:var(--K)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:17px;min-height:44px}
.nav .navt{font-weight:600}.nav .navl,.nav .navr{min-width:40px}.nav .navr{text-align:right}
.big{display:flex;justify-content:space-between;align-items:center;padding:8px 20px}
.big h2{font-size:32px;font-weight:700;margin:0;letter-spacing:-.01em}
.big button{font-weight:600;font-size:16px}
.blk{padding:12px 20px;display:flex;flex-direction:column;gap:10px}
.label{font-size:13px;font-weight:600;color:var(--G2)}
.h1{font-size:26px;font-weight:700;margin:0;line-height:1.2}
.h2{font-size:20px;font-weight:700;margin:0}
.p{font-size:15px;line-height:1.4;margin:0}
.small{font-size:13px;color:var(--G2);margin:0;line-height:1.4}
.center{text-align:center;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;border-radius:14px;font-weight:600;font-size:17px;padding:16px 20px;width:100%}
.btn.primary{background:var(--K);color:var(--W)}
.btn.secondary{background:var(--G1);font-size:15px;padding:12px 16px}
.btn.outline{border:1.5px solid var(--K);font-size:15px;padding:12px 16px}
.btn.psmall{background:var(--K);color:var(--W);font-size:15px;padding:10px 16px;width:auto}
.btn.text{color:var(--G2);font-size:15px;font-weight:500;padding:8px;width:auto}
.btnrow{display:flex;gap:8px}.btnrow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--G1);font-size:14px;font-weight:500}
.chip.on{background:var(--K);color:var(--W)}
.seg{display:flex;gap:4px;background:var(--G1);border-radius:12px;padding:4px}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-size:15px}
.seg button.on{background:var(--W);border:1px solid var(--K);font-weight:600}
.sw{width:48px;height:28px;border-radius:999px;background:var(--G1);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--W);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.sw.on{background:var(--K)}.sw.on::after{left:23px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.row.tap{cursor:pointer}
.rt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rtt{font-size:16px;font-weight:500}.rtt.muted{color:var(--G2)}
.rts{font-size:13px;color:var(--G2)}
.rr{font-size:15px;color:var(--G2)}.rr.strong{color:var(--K);font-weight:500}
.face{width:var(--s);height:var(--s);border-radius:50%;background:var(--G1);display:inline-flex;align-items:center;justify-content:center;font-weight:500;font-size:calc(var(--s)*.36);flex:none}
.face.ring{box-shadow:0 0 0 2px var(--K)}
.face.dark{background:var(--K);color:var(--W)}
.faces{display:inline-flex}.faces .face{box-shadow:0 0 0 2px var(--W);margin-left:-8px}.faces .face:first-child{margin-left:0}
.who{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.status{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500}
.status i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--K)}.status i.f{background:var(--K)}
.card{border:1px solid var(--G1);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--W);text-align:left;width:100%}
.card.strong{border:1.5px solid var(--K)}
.card.fill{background:var(--G1);border-color:var(--G1)}
.tag{display:inline-block;border:1px solid var(--K);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.input{background:var(--G1);border-radius:12px;padding:14px;font-size:16px;border:0;width:100%;color:var(--K);font-family:inherit}
.input::placeholder{color:var(--G2)}
.map{position:relative;background:var(--G1);overflow:hidden}
.map .st{position:absolute;background:var(--W)}
.pin{position:absolute;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--W);border:1px solid var(--K);font-size:12px;font-weight:500;white-space:nowrap}
.pin i{width:8px;height:8px;border-radius:50%;background:var(--K)}.pin.place i{background:none;border:1.5px solid var(--K)}
.pin.on{background:var(--K);color:var(--W)}.pin.on i{background:var(--W)}
.photo{background:var(--G1) linear-gradient(to top right,transparent calc(50% - .6px),var(--G2) 50%,transparent calc(50% + .6px)),linear-gradient(to bottom right,transparent calc(50% - .6px),var(--G2) 50%,transparent calc(50% + .6px));background-color:var(--G1)}
.tabs{display:flex;border-top:1px solid var(--G1);padding:10px 8px 2px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--G2)}
.tabs button i{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--G2)}
.tabs button.on{color:var(--K);font-weight:600}.tabs button.on i{background:var(--K);border-color:var(--K)}
.bub{display:flex;flex-direction:column;gap:3px}.bub.me{align-items:flex-end}
.bub span{font-size:12px;color:var(--G2);font-weight:500}
.bub p{margin:0;padding:10px 14px;border-radius:18px;background:var(--G1);font-size:15px;max-width:78%}
.bub.me p{background:var(--K);color:var(--W)}
.sys{text-align:center;font-size:12px;color:var(--G2);font-weight:500}
.inputbar{display:flex;gap:10px;align-items:center;padding:8px 16px}
.inputbar .input{border-radius:20px;padding:10px 16px;font-size:15px}
.send{width:36px;height:36px;border-radius:50%;background:var(--K);color:var(--W);flex:none;font-weight:600}
.unread{width:10px;height:10px;border-radius:50%;background:var(--K)}
.tb{width:44px;height:44px;border-radius:12px;background:var(--G1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:none}
.meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:13px;color:var(--G2)}
.statusbar{display:flex;align-items:center;gap:10px;border:1.5px solid var(--K);border-radius:14px;padding:14px 16px}
.statusbar b{flex:1;font-size:16px}.statusbar i{width:10px;height:10px;border-radius:50%;background:var(--K)}
.slider{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--G2);font-weight:500}
.slider input{flex:1;accent-color:#000}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--G1)}.dots i.on{background:var(--K)}
.check{width:72px;height:72px;border-radius:50%;background:var(--K);color:var(--W);display:flex;align-items:center;justify-content:center;font-size:30px}
.qr{width:150px;height:150px;border:1px solid var(--K);position:relative;background:var(--W)}
.qr i{position:absolute;background:var(--K)}
.qr b{position:absolute;width:35px;height:35px;border:5px solid var(--K)}.qr b::after{content:"";position:absolute;inset:6px;background:var(--K)}
.pulse{width:180px;height:180px;border-radius:50%;border:2px solid var(--G1);display:flex;align-items:center;justify-content:center}
.pulse>div{width:120px;height:120px;border-radius:50%;border:2px solid var(--G2);display:flex;align-items:center;justify-content:center}
.toast{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--K);color:var(--W);font-size:13px;padding:10px 14px;border-radius:12px;display:flex;gap:12px;z-index:30;white-space:nowrap}
.toast button{color:var(--W);font-weight:600}
/* overlays */
.ov{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column}
.ov .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.ov.modal{align-items:center;justify-content:center;padding:24px}.ov.modal .dialog:has(.iosbtns){width:290px!important;max-width:290px!important;background:rgba(250,250,250,.98)!important;border-radius:14px!important;padding:18px 16px 16px!important;gap:6px!important;text-align:center;box-shadow:none!important}.ov.modal .dialog:has(.iosbtns)>b{font-size:17px!important;line-height:1.25}.ov.modal .dialog:has(.iosbtns)>p{font-size:13px!important;line-height:1.35}
.ov .dialog{position:relative;background:var(--W);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;width:100%}
.ov.drawer{justify-content:flex-end}
.ov .sheet{position:relative;background:var(--W);border-radius:24px 24px 0 0;padding:10px 20px 30px;display:flex;flex-direction:column;gap:14px}
.grab{width:36px;height:5px;border-radius:3px;background:var(--G2);margin:0 auto 4px}
/* motion */
@keyframes inR{from{transform:translateX(100%)}to{transform:none}}
@keyframes outL{from{transform:none}to{transform:translateX(-30%)}}
@keyframes inL{from{transform:translateX(-30%)}to{transform:none}}
@keyframes outR{from{transform:none}to{transform:translateX(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.a-inR{animation:inR .3s ease-out both;z-index:2}.a-outL{animation:outL .3s ease-out both}
.a-inL{animation:inL .3s ease-out both}.a-outR{animation:outR .3s ease-out both;z-index:2}
.ov.modal{animation:fade .2s ease-out}.ov.drawer .back{animation:fade .25s ease-out}.ov.drawer .sheet{animation:up .3s ease-out}
@media (prefers-reduced-motion:reduce){.a-inR,.a-outL,.a-inL,.a-outR,.ov.modal,.ov.drawer .back,.ov.drawer .sheet{animation:none}}
/* notes */
.npin{position:absolute;z-index:45;width:26px;height:26px;border-radius:50% 50% 50% 4px;background:var(--accent);color:#fff;font:600 12px var(--sans);transform:translate(-4px,-22px);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.npin.done{opacity:.4}.npin.sel{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--accent)}.npin.new{background:#000}
.nlayer{position:absolute;inset:0;z-index:44;cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2232%22%20height%3D%2232%22%20viewBox%3D%220%200%2032%2032%22%3E%3Cpath%20d%3D%22M6%2029Q2%2029%202%2025V16A13%2013%200%201%201%2015%2029Z%22%20fill%3D%22%23000%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222%22/%3E%3Cpath%20d%3D%22M15%2011v10M10%2016h10%22%20stroke%3D%22%23fff%22%20stroke-width%3D%222.2%22%20stroke-linecap%3D%22round%22/%3E%3C/svg%3E") 3 29,crosshair;background:color-mix(in srgb,var(--accent) 10%,transparent)}
.notebar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:12px;color:var(--muted)}
.notebar button,.ned button{font-size:13px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.notebar button.on,.ned button.save{background:var(--accent);color:#fff;border-color:var(--accent)}
.notebar button:disabled{opacity:.5;cursor:default}
.ned{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.ned textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:8px;font:14px var(--sans);background:var(--page);color:var(--ink);resize:vertical}
.ned div{display:flex;gap:8px;justify-content:flex-end}
.notes{display:flex;flex-direction:column;gap:6px}
.notes h2{font-size:12px;margin:0;color:var(--muted);font-weight:600}
.ngo{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--ink) 4%,transparent);margin-top:6px;font-size:13px}.ngo:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}.ngh{display:flex;justify-content:space-between}.ngh span{color:#888}.ngt{display:flex;align-items:center;gap:6px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ngt i{width:8px;height:8px;border-radius:4px;flex:none}.note{display:flex;gap:8px;font-size:13px;padding:8px;border-radius:8px;border:1px solid var(--line);line-height:1.4}
.note.sel{border-color:var(--accent)}
.note .num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
.note.done .txt{text-decoration:line-through;color:var(--muted)}
.note .acts{display:flex;gap:12px;margin-top:4px}.note .acts button{font-size:12px;color:var(--accent)}
.badge{margin-left:auto;font-style:normal;font-family:var(--mono);font-size:11px;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;align-self:center}
/* v2 additions */
.screen.full{display:block}
.homewrap{position:absolute;inset:0;overflow:hidden}
.homewrap .map{position:absolute;inset:0}
.htop{position:absolute;left:0;right:0;top:47px;z-index:5;display:flex;flex-direction:column;gap:8px;padding:6px 16px 0}
.htop .bar{display:flex;gap:10px;align-items:center}
.htop .search{flex:1;background:var(--W);border:1px solid var(--K);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--G2);text-align:left}
.htop .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.htop .chips::-webkit-scrollbar{display:none}
.htop .chip{background:var(--W);border:1px solid var(--K);white-space:nowrap}.htop .chip.on{background:var(--K)}
.htop .div{width:1px;background:var(--G2);flex:none;margin:4px 2px}
.locbtn{position:absolute;right:16px;z-index:5;width:40px;height:40px;border-radius:50%;background:var(--W);border:1px solid var(--K);display:flex;align-items:center;justify-content:center}
.locbtn i{width:10px;height:10px;border-radius:50%;border:2px solid var(--K)}
.cluster{position:absolute;width:38px;height:38px;border-radius:50%;background:var(--K);color:var(--W);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 4px rgba(0,0,0,.12)}
.hsheet{position:absolute;left:0;right:0;bottom:0;height:700px;background:var(--W);border-radius:22px 22px 0 0;box-shadow:0 -4px 24px rgba(0,0,0,.12);z-index:6;display:flex;flex-direction:column;transition:transform .28s ease-out;touch-action:none}
.hsheet.drag{transition:none}
.hsheet .grabzone{padding:8px 16px 6px;cursor:grab;flex:none}
.hsheet .grabzone .grab{margin-bottom:10px}
.hsheet .sc{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:110px;scrollbar-width:none}.hsheet .sc::-webkit-scrollbar{display:none}
.hsheet.peek .sc,.hsheet.half .sc{overflow:hidden}
.hfoot{position:absolute;left:0;right:0;bottom:0;z-index:7;background:var(--W)}
.ctaRow{display:flex;gap:10px;align-items:center}
.ctaRow .btn.primary{flex:1}
.plus{width:54px;height:54px;border-radius:14px;border:1.5px solid var(--K);font-size:26px;flex:none;display:flex;align-items:center;justify-content:center}
.sect{padding:10px 16px;display:flex;flex-direction:column;gap:10px}
.sect h3{margin:0;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.sect h3 small{font-size:13px;font-weight:500;color:var(--G2)}
.hscroll{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.hscroll::-webkit-scrollbar{display:none}
.person{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;flex:none;width:56px;text-align:center}
.pcard{border:1px solid var(--G1);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;width:100%}
.pcard .thumb{width:56px;height:56px;border-radius:12px;flex:none}
.pcard .info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pcard .info b{font-size:16px}

const view=document.getElementById("view"),phone=document.getElementById("phone");
let timer=null;
function cur(){return S.stack[S.stack.length-1]}
function build(id){const sc=SCREENS[id];const d=sc.r();const el=document.createElement("div");el.className="screen"+(d.full?" full":"");el.innerHTML=d.full?`${d.full}<div class="sb" style="position:absolute;top:0;left:0;right:0;z-index:8;background:transparent"><span>9:41</span><span class="bat">5G<i></i></span></div>`:`<div class="sb"><span>9:41</span><span class="bat">5G<i></i></span></div><div class="scroll">${d.body}</div>${d.foot?`<div class="foot">${d.foot}</div>`:""}<div class="hi"><i></i></div>`;return el}
function render(dir){const old=view.querySelector(".screen:not(.leaving)");const el=build(cur());
 if(old&&dir){const inC=dir==="fwd"?"a-inR":"a-inL",outC=dir==="fwd"?"a-outL":"a-outR";old.classList.add("leaving",outC);el.classList.add(inC);view.appendChild(el);if(dir==="back")view.appendChild(old);setTimeout(()=>{old.remove();el.classList.remove(inC)},320);}
 else{view.innerHTML="";view.appendChild(el);}
 if(cur()==="m01"){bindSheet(el);bindMap(el)}if(cur()==="m16")bindBadge(el);renderOv();sideUpdate();}
function renderOv(){phone.querySelectorAll(".ov").forEach(o=>o.remove());if(!S.ov)return;const o=OVERLAYS[S.ov];const el=document.createElement("div");el.className="ov "+o.type;el.innerHTML=`<div class="back" ${A.close}></div><div class="${o.type==="modal"?"dialog":"sheet"}">${o.r()}</div>`;phone.appendChild(el);}
function go(id){S.ov=null;S.stack.push(id);render("fwd")}
function back(){if(S.ov){S.ov=null;renderOv();sideUpdate();return}if(S.stack.length>1){S.stack.pop();render("back")}}
function tab(id){S.ov=null;S.stack=[id];render(null)}
function openOv(id){S.ov=id;renderOv();sideUpdate()}
function closeOv(){S.ov=null;renderOv();sideUpdate()}
function toast(msg,undo){phone.querySelectorAll(".toast").forEach(t=>t.remove());const t=document.createElement("div");t.className="toast";t.innerHTML=`<span>${msg}</span>${undo?`<button data-act="undo">Undo</button>`:""}`;phone.appendChild(t);setTimeout(()=>t.remove(),2600)}
function refresh(){const sc=view.querySelector(".screen:not(.leaving) .scroll, .screen:not(.leaving) .hsheet .sc");const y=sc?sc.scrollTop:0;render(null);const n=view.querySelector(".screen .scroll, .screen .hsheet .sc");if(n)n.scrollTop=y}
function bindMap(el){const m=el.querySelector(".homewrap .map");if(!m)return;const c=S.cam||(S.cam={x:0,y:0,z:1});
 const lim=()=>{const L=260*c.z;c.x=Math.max(-L,Math.min(L,c.x));c.y=Math.max(-L,Math.min(L,c.y))};
 const ap=()=>{lim();m.style.transform=`translate(${c.x}px,${c.y}px) scale(${c.z})`;m.style.setProperty("--z",c.z)};ap();
 const P=new Map();let moved=false,d0=0,z0=1;
 m.addEventListener("pointerdown",e=>{P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;if(P.size===2){const[a,b]=[...P.values()];d0=Math.hypot(a.x-b.x,a.y-b.y);z0=c.z}});
 m.addEventListener("pointermove",e=>{const p=P.get(e.pointerId);if(!p)return;const dx=(e.clientX-p.x)/SC,dy=(e.clientY-p.y)/SC;p.x=e.clientX;p.y=e.clientY;
  if(P.size===1){if(!moved&&Math.hypot(dx,dy)<2)return;if(!moved){moved=true;try{m.setPointerCapture(e.pointerId)}catch(_){}}c.x+=dx;c.y+=dy;ap()}
  else if(P.size===2){moved=true;const[a,b]=[...P.values()];c.z=Math.max(.6,Math.min(3,z0*Math.hypot(a.x-b.x,a.y-b.y)/d0));ap()}});
 const up=e=>{P.delete(e.pointerId)};m.addEventListener("pointerup",up);m.addEventListener("pointercancel",up);
 m.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true);
 m.addEventListener("wheel",e=>{e.preventDefault();if(e.ctrlKey){c.z=Math.max(.6,Math.min(3,c.z*Math.exp(-e.deltaY*.01)))}else{c.x-=e.deltaX/SC;c.y-=e.deltaY/SC}ap()},{passive:false});}
function bindBadge(el){const b=el.querySelector("#badge");if(!b)return;const L=b.parentNode;let a=0,v=0,lx=null,run=true;
 const tick=()=>{if(!b.isConnected)return;v+=-a*.03;v*=.93;a+=v;a=Math.max(-6,Math.min(6,a));L.style.transform=`rotate(${a}deg)`;requestAnimationFrame(tick)};v=.8;tick();
 phone.addEventListener("pointermove",e=>{if(!b.isConnected)return;if(lx!==null)v+=Math.max(-.25,Math.min(.25,(e.clientX-lx)*.01));lx=e.clientX});
 if(window.DeviceOrientationEvent)addEventListener("deviceorientation",e=>{if(b.isConnected&&e.gamma!=null)v+=(e.gamma*.5-a)*.004})}
function bindSheet(el){const sh=el.querySelector("#hsheet"),g=el.querySelector("#grab");if(!sh)return;const V={peek:170,half:470,full:690};let y0=null,t0=0,moved=false;
 g.addEventListener("pointerdown",e=>{if(e.target.closest("button"))return;y0=e.clientY;t0=700-V[S.sheet];moved=false;sh.classList.add("drag");g.setPointerCapture(e.pointerId)});
 g.addEventListener("pointermove",e=>{if(y0==null)return;const dy=(e.clientY-y0)/SC;if(Math.abs(dy)>4)moved=true;sh.style.transform=`translateY(${Math.min(700-V.peek,Math.max(700-V.full,t0+dy))}px)`});
 g.addEventListener("pointerup",e=>{if(y0==null)return;sh.classList.remove("drag");const dy=(e.clientY-y0)/SC;y0=null;let next;if(!moved){next={peek:"half",half:"full",full:"peek"}[S.sheet]}else{const vis=700-(t0+dy);next=Object.entries(V).sort((a,b)=>Math.abs(a[1]-vis)-Math.abs(b[1]-vis))[0][0]}S.sheet=next;refresh()});}
const ACT={
 "loc:once":()=>{S.locAsked=1;closeOv()},"loc:yes":()=>{S.locAsked=1;closeOv()},"loc:no":()=>{S.locAsked=1;closeOv();toast("You can turn on location in Settings")},
