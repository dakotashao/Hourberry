<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hourberry · core</title>
<style>
:root{--ink:#1c1c1e;--g0:#fafafc;--g1:#f3f3f7;--g2:#e8e8ed;--g3:#d1d1d6;--g4:#8e8e93;--mute:#8e8e93;--page:#e9e9ee;--canvas:#f2f2f7;--glass:rgba(255,255,255,.72);--blur:blur(20px) saturate(180%);--hair:0 0 0 .5px rgba(0,0,0,.05);--shf:0 8px 24px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.04);--shc:0 2px 12px rgba(0,0,0,.05)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--page);font-family:Inter,-apple-system,system-ui,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
.phone{width:390px;height:844px;border-radius:48px;background:#fff;position:relative;overflow:hidden;box-shadow:0 0 0 10px #111,0 30px 60px rgba(0,0,0,.25)}
@media (max-width:430px){body{display:block}.phone{width:100vw;height:100dvh;border-radius:0;box-shadow:none}}
.sb{position:absolute;top:0;left:0;right:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0;font-weight:600;font-size:15px;z-index:60;pointer-events:none}
.view{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.scroll{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
.nav{height:100px;padding:52px 16px 0;display:flex;align-items:center;gap:10px;flex:none}
.nav h1{font-size:17px;font-weight:700;flex:1;text-align:center}
.nav .side{width:72px;display:flex}.nav .side.r{justify-content:flex-end}
.circ{width:40px;height:40px;border-radius:50%;background:var(--g1);display:flex;align-items:center;justify-content:center;flex:none}
.h1{font-size:30px;font-weight:800;line-height:1.1}
.lab{font-size:13px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.05em;margin:22px 0 8px}
.small{font-size:13px;color:var(--mute);line-height:1.4}
.btn{height:52px;border-radius:26px;background:#000;color:#fff;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.s{background:var(--g1);color:#000}.btn.sm{height:40px;font-size:15px;width:auto;padding:0 18px}.btn.t{background:none;color:#000;height:40px}
.btn[disabled]{background:var(--g3);color:#fff}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%}
.row .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.row .tx b{font-size:16px;font-weight:600}.row .tx small{font-size:13px;color:var(--mute)}
.card{background:var(--g1);border-radius:16px;padding:12px 14px;width:100%}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;background:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:#000;display:inline-block}
.badge{min-width:18px;height:18px;border-radius:9px;background:#000;color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;display:flex;justify-content:space-around;padding-top:8px;z-index:30;box-shadow:0 -1px 0 var(--g2)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--g4);width:80px;position:relative}
.tabs button.on{color:#000}.tabs .badge{position:absolute;top:-4px;right:20px}
/* map */
.map{position:absolute;inset:0;background:#ececec;overflow:hidden}
.map .rd{position:absolute;background:#f8f8f8}.map .bk{position:absolute;background:#e0e0e0;border-radius:8px}
.pin{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:2;transition:opacity .2s}
.pin.later{color:#777;font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.1)}.pin.later .fc i{background:var(--g2)!important;color:#888!important}
.pin.mine{background:#000;color:#fff}
.pin.hide{opacity:0;pointer-events:none}.pin.dim{opacity:.3}.pin.hit{background:#000;color:#fff}
.place{position:absolute;transform:translate(-50%,-50%);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.14);white-space:nowrap;display:flex;gap:6px;align-items:center}
.place .fc{margin-left:-6px}.place .pm{font-size:11px;font-weight:800;color:var(--mute);margin-left:-2px}
.place em{font-style:normal;font-size:10px;font-weight:800;background:var(--g1);border-radius:999px;padding:2px 6px}
.place.dim{opacity:.3}.place.hit{background:#000;color:#fff}.place.hit em{background:#333}
.you{position:absolute;width:16px;height:16px;border-radius:50%;background:#000;box-shadow:0 0 0 7px rgba(0,0,0,.12);transform:translate(-50%,-50%)}
.free3{position:absolute;display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.14);z-index:3}
.mtop{position:absolute;left:16px;right:16px;top:54px;display:flex;align-items:center;gap:8px;z-index:20}
.mtop .circ{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.12);width:44px;height:44px}
.seg{display:flex;background:#fff;border-radius:999px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}.seg button{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14px}.seg .on{background:#000;color:#fff}
.chip{display:inline-flex;align-items:center;gap:4px;background:#fff;border-radius:999px;padding:0 12px;height:36px;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap}
.sbox{flex:1;min-width:0;height:44px;border-radius:22px;background:#fff;display:flex;align-items:center;gap:8px;padding:0 6px 0 14px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.sbox input{flex:1;min-width:0;border:0;outline:0;font-size:16px;background:none}
.hint{position:absolute;left:16px;right:16px;top:106px;z-index:20;display:flex;align-items:center;gap:8px;background:#fff;border-radius:14px;padding:0 6px 0 14px;height:44px;box-shadow:0 2px 8px rgba(0,0,0,.12);font-size:14px}
.hint span{flex:1;color:#333}
/* drawer */
.drawer{position:absolute;left:0;right:0;bottom:84px;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.1);z-index:10;display:flex;flex-direction:column;transition:height .3s cubic-bezier(.2,.8,.2,1)}
.drawer.nodrag{transition:none}
.grab{height:24px;flex:none;display:flex;justify-content:center;align-items:center;cursor:grab;touch-action:none}.grab i{width:40px;height:5px;border-radius:3px;background:var(--g3)}
.drawer .scroll{padding-bottom:16px}
.cta{display:flex;gap:10px;margin:2px 0 6px}
.gh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 8px}.gh b{font-size:18px}.gh span{font-size:13px;color:var(--mute)}
.prow{background:var(--g1);border-radius:16px;padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;width:100%}
.prow .r1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.prow .r1 b{font-size:16px}
.prow .r2{display:flex;align-items:center;gap:8px;font-size:13px;color:#333}
.prow .r3{display:flex;align-items:center;gap:5px;font-size:13px;color:#555;flex-wrap:wrap}.prow .r3 span{display:flex;align-items:center;gap:4px}.prow .r3 strong{color:#000}
.in{font-size:12px;font-weight:800;background:#000;color:#fff;border-radius:999px;padding:3px 9px}
.fc{display:flex}.fc i{position:relative;border-radius:50%;background:#d6d6d6;box-shadow:0 0 0 2px #fff;font-style:normal;font-weight:700;display:flex;align-items:center;justify-content:center}.fc i:first-child{background:#000;color:#fff}
.prow .fc i{box-shadow:0 0 0 2px var(--g1)}
.cats{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}.cats button{flex:none;background:var(--g1);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600}
.res{display:flex;align-items:center;gap:12px;padding:10px 0;width:100%}.res .ic{width:40px;height:40px;border-radius:12px;background:var(--g1);display:flex;align-items:center;justify-content:center;flex:none}.res .tx{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}.res .tx b{font-size:15px}.res .tx small{font-size:13px;color:var(--mute)}
.tag{font-size:11px;font-weight:800;background:var(--g1);border-radius:999px;padding:3px 8px;white-space:nowrap}.tag.k{background:#000;color:#fff}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:41;max-height:92%;display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .scroll{padding-bottom:34px}
.sheet h2{font-size:22px;font-weight:800;padding-right:48px}.sx{position:absolute;right:14px;top:14px;width:34px;height:34px;z-index:2}
.modal{position:absolute;left:24px;right:24px;top:50%;transform:translate(0,-50%);background:#fff;border-radius:24px;padding:22px;z-index:41;display:flex;flex-direction:column;gap:10px;animation:fade .2s}
.modal h3{font-size:20px}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.opts button{height:48px;border-radius:14px;background:var(--g1);font-weight:700}.opts .on{background:#000;color:#fff}
.segc{display:grid;grid-template-columns:repeat(4,1fr);background:#eeeef0;border-radius:9px;padding:2px;position:relative}
.segc button{height:32px;border-radius:7px;font-size:15px;font-weight:500;position:relative;z-index:1;text-align:center}.segc button.on{font-weight:700}
.segc .thumb{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/4);border-radius:7px;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.12)}
.fsum{font-size:15px;color:var(--mute);margin:10px 2px 0}.fsum b{color:#000}
.grp{background:#f2f2f7;border-radius:10px;margin-top:16px;overflow:hidden}
.grp .cell{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:46px;padding:0 16px;font-size:16px}
.grp .cell .v{color:var(--mute)}
.foot{font-size:13px;color:var(--mute);margin:6px 16px 0}
.fsw{width:51px;height:31px;border-radius:16px;background:#e3e3e6;position:relative;flex:none}.fsw::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);transition:left .2s}.fsw.on{background:#34c759}.fsw.on::after{left:22px}
.picker{position:relative;height:176px;display:flex;justify-content:center;gap:4px;border-top:.5px solid rgba(60,60,67,.18)}
.picker .band{position:absolute;left:12px;right:12px;top:69px;height:36px;border-radius:8px;background:rgba(118,118,128,.12);pointer-events:none}
.col{width:64px;height:176px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent)}.col::-webkit-scrollbar{display:none}.col .pad{height:70px}
.col button{display:flex;width:100%;height:36px;align-items:center;justify-content:center;scroll-snap-align:center;font-size:21px}
/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:100px;background:#111;color:#fff;border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;z-index:55;font-size:14px;animation:fade .2s}
.toast span{flex:1}.toast button{font-weight:800;color:#fff}
/* picks */
.pk{position:absolute;inset:0;background:#fff;z-index:35;display:flex;flex-direction:column}
.pktop{padding:52px 16px 0;display:flex;justify-content:space-between;align-items:center}
.pkh{padding:10px 20px 0}.pkh h1{font-size:32px;font-weight:800}
.pkh .sub{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--mute);margin-top:4px}.pkh .sub button{text-decoration:underline;color:#000}
.vcard{position:relative;margin:14px 16px 0;flex:1;max-height:520px;background:var(--g1);border-radius:28px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;touch-action:pan-y}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 0;position:relative;z-index:3}
.vtog{display:flex;background:#fff;border-radius:999px;padding:3px}.vtog button{width:34px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#6b6b6b}.vtog .on{background:#000;color:#fff}
.vhero{position:relative;flex:1;min-height:250px}
.bunch{position:absolute;left:50%;top:46px;width:320px;height:230px;transform:translateX(-50%)}
.vb{position:absolute;display:flex;align-items:center;justify-content:center;background:#d6d6d6;color:#000;font-weight:800;transition:transform .5s cubic-bezier(.3,1.4,.5,1),background .3s}
.vb.host{background:#000;color:#fff}.vb.seat{background:#fff;color:#999}.vb.seat.soft{background:#fafafa}.vb.more{background:#c8c8c8}
.vb.me{background:#000;color:#fff;animation:drop .55s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-140px) scale(.6)}70%{transform:translateY(6px) scale(1.06)}100%{transform:none}}
.squeeze .vb:not(.me){transform:scale(.92)}
.vnm{position:absolute;transform:translateX(-50%);font-size:12px;font-weight:600;color:#333;white-space:nowrap}.vnm.b{font-weight:800;color:#000}
.vhost{position:absolute;transform:translateX(-50%);font-size:11px;font-weight:800;background:#fff;border-radius:999px;padding:2px 8px;white-space:nowrap}
.vnote{position:absolute;left:50%;transform:translateX(-50%);top:2px;background:#fff;border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:13px;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;z-index:2}
.vmap{background:#e6e6e6;margin-top:-52px;padding-top:52px;overflow:hidden}.vmap i.r{position:absolute;background:#f6f6f6}
.vwhy{display:flex;align-items:center;gap:8px;align-self:flex-start;margin:0 16px 12px;background:#fff;border-radius:999px;padding:5px 12px 5px 5px;font-size:13px;font-weight:600}
.vbot{background:#e8e8e8;padding:14px 20px 18px;display:flex;flex-direction:column;gap:6px}.vbot .t{font-size:26px;font-weight:800;line-height:1.15}
.vmeta{display:flex;align-items:center;gap:6px;font-size:14px;color:#555;flex-wrap:wrap}.vmeta span{display:flex;align-items:center;gap:5px}.vmeta strong{color:#000}
.vext{display:flex;gap:6px}.vext em{font-style:normal;background:#000;color:#fff;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.dots{display:flex;justify-content:center;gap:2px;margin:12px 0}.dots button{width:8px;height:8px;padding:5px;box-sizing:content-box;border-radius:10px;background:#cfcfcf;background-clip:content-box}.dots .on{width:18px;background-color:#000}
.pkact{display:flex;gap:10px;padding:0 16px 34px}
.pkend{margin:14px 16px 0;flex:1;max-height:520px;background:var(--g1);border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
/* plan page */
.band{display:flex;justify-content:center;align-items:flex-end;padding:20px 0 4px;flex-wrap:wrap;gap:14px 0}
.band span{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:700;margin:0 -4px;width:66px}
.band em{font-style:normal;font-size:11px;color:var(--mute);font-weight:600}
.state{background:#000;color:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;margin-top:12px}.state small{color:#ccc;font-size:13px}
.omap{position:relative;height:190px;border-radius:18px;background:#e9e9e9;overflow:hidden;margin-top:8px}
.omap .r{position:absolute;background:#f6f6f6}
.chatprev{display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;align-items:flex-end;margin:6px 0}.msg .bb{background:var(--g1);border-radius:16px 16px 16px 4px;padding:8px 12px;font-size:15px;max-width:260px}.msg.me{justify-content:flex-end}.msg.me .bb{background:#000;color:#fff;border-radius:16px 16px 4px 16px}
.msg small{display:block;font-size:11px;color:var(--mute);margin-bottom:2px}
.sys{text-align:center;font-size:12px;color:var(--mute);margin:10px 0}
.compose{display:flex;gap:8px;padding:10px 16px 30px;border-top:1px solid var(--g2);flex:none}.compose input{flex:1;height:42px;border-radius:21px;background:var(--g1);border:0;padding:0 16px;outline:0;font-size:15px}
.pcta{position:sticky;top:0;z-index:2;background:#fff;padding:8px 0}
.seg2{display:flex;gap:6px;margin:6px 0}.seg2 button{padding:8px 14px;border-radius:999px;background:var(--g1);font-weight:700;font-size:14px}.seg2 .on{background:#000;color:#fff}
.newc{background:var(--g1);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:8px;width:100%}
.newc .tx{flex:1;display:flex;flex-direction:column;gap:2px}.newc .tx b{font-size:15px}.newc .tx small{font-size:13px;color:var(--mute)}
.unread{width:9px;height:9px;border-radius:50%;background:#000;flex:none}
.sw{width:48px;height:28px;border-radius:14px;background:var(--g3);position:relative;flex:none;transition:background .2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .2s}.sw.on{background:#000}.sw.on::after{left:23px}
@media (prefers-reduced-motion:reduce){.vb.me{animation:none}.vb{transition:none}.sheet,.scrim,.modal,.toast{animation:none}.drawer{transition:none}.load *{animation:none!important}}
/* loading */
.load{position:absolute;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .35s}
.load.out{opacity:0;pointer-events:none}
.lb{position:relative;width:120px;height:90px}.lb i{position:absolute;border-radius:52% 48% 46% 54%/50% 54% 46% 50%;background:#cfcfcf;animation:gather .9s cubic-bezier(.3,1.3,.5,1) both}
.lb i:nth-child(1){left:30px;top:22px;width:46px;height:46px;background:#000;--fx:-70px;--fy:-60px}
.lb i:nth-child(2){left:68px;top:10px;width:30px;height:30px;--fx:80px;--fy:-50px;animation-delay:.08s}
.lb i:nth-child(3){left:72px;top:44px;width:34px;height:34px;--fx:90px;--fy:60px;animation-delay:.16s}
.lb i:nth-child(4){left:8px;top:52px;width:26px;height:26px;--fx:-80px;--fy:70px;animation-delay:.24s}
@keyframes gather{from{transform:translate(var(--fx),var(--fy)) scale(.6);opacity:0}}
.load p{font-size:17px;font-weight:700;animation:fade .5s .7s both}
.empty{background:var(--g1);border-radius:16px;padding:22px 16px;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}

/* ===== 11/10 Gentler-style pass ===== */
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
.btn{background:var(--ink)}.btn.s{background:var(--g1);color:var(--ink)}
.sb svg{display:block}.sb .r{display:flex;gap:6px;align-items:center}
.glass,.mtop .circ,.seg,.chip,.sbox,.hint{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shf),var(--hair)}
.seg button{color:var(--mute)}.seg .on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.map{background:var(--canvas)}.map .rd{background:#fafafc}.map .bk{background:#e6e6eb;border-radius:16px}
.map::after{content:"";position:absolute;left:0;right:0;top:0;height:120px;background:linear-gradient(#fff,rgba(255,255,255,0));pointer-events:none}
.pin{background:rgba(255,255,255,.86);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);box-shadow:var(--shc),var(--hair);padding:3px 10px 3px 3px;font-size:13px}
.pin.saved{box-shadow:0 0 0 1.5px var(--ink),var(--shc)}

function zoomAt(f,cx,cy){const z0=S.z,z1=Math.max(.6,Math.min(1.8,z0*f));if(z1===z0)return;S.pan={x:cx-(cx-S.pan.x)*z1/z0,y:cy-(cy-S.pan.y)*z1/z0};S.z=z1}
let zr=0;function zoomRender(){if(zr)return;zr=requestAnimationFrame(()=>{zr=0;render()})}
function bindMap(){const m=$("#map");if(!m)return;let x0=null,y0=null,moved=false,id=null;const pts=new Map();let d0=0;
 const ph=$("#ph"),rel=e=>{const r=ph.getBoundingClientRect(),k=r.width/390;return[(e.clientX-r.left)/k,(e.clientY-r.top)/k]};
 m.onwheel=e=>{e.preventDefault();const [cx,cy]=rel(e);zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),cx,cy);m.style.transition="none";zoomRender()};
 m.ondblclick=e=>{const [cx,cy]=rel(e);zoomAt(1.4,cx,cy);render()};
 m.addEventListener("pointerdown",e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2){const [a,b]=[...pts.values()];d0=Math.hypot(a[0]-b[0],a[1]-b[1]);x0=null}});
 m.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,[e.clientX,e.clientY]);if(pts.size===2&&d0){const [a,b]=[...pts.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);const [cx,cy]=rel({clientX:(a[0]+b[0])/2,clientY:(a[1]+b[1])/2});zoomAt(d/d0,cx,cy);d0=d;swiped=true;zoomRender()}});
 const up=e=>{pts.delete(e.pointerId);if(pts.size<2)d0=0};m.addEventListener("pointerup",up);m.addEventListener("pointercancel",up);
 m.onpointerdown=e=>{if(e.button)return;x0=e.clientX;y0=e.clientY;moved=false;id=e.pointerId};
 m.onpointermove=e=>{if(x0===null||pts.size>1)return;const dx=e.clientX-x0,dy=e.clientY-y0;if(!moved&&Math.hypot(dx,dy)<6)return;if(!moved){moved=true;m.setPointerCapture(id);m.style.transition="none"}m.style.transform=`translate(${S.pan.x+dx}px,${S.pan.y+dy}px)`};
 m.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;if(!moved)return;swiped=true;setTimeout(()=>swiped=false,60);S.pan={x:Math.max(-400,Math.min(400,S.pan.x+dx)),y:Math.max(-400,Math.min(400,S.pan.y+dy))};render()}}
function bindDrawer(){const g=$("#grab"),d=$("#drawer");if(!g)return;let y0=null,h0=0,moved=false;
 g.onpointerdown=e=>{y0=e.clientY;h0=d.offsetHeight;moved=false;d.classList.add("nodrag");g.setPointerCapture(e.pointerId)};
 g.onpointermove=e=>{if(y0===null)return;const dy=e.clientY-y0;if(Math.abs(dy)>4)moved=true;d.style.height=Math.max(200,Math.min(760,h0-dy))+"px"};
 g.onpointerup=e=>{if(y0===null)return;d.classList.remove("nodrag");const h=d.offsetHeight;y0=null;if(!moved){S.drawer={peek:"half",mid:"full",half:"full",full:"half"}[S.drawer]}else S.drawer=Object.keys(DH).reduce((a,b)=>Math.abs(DH[b]-h)<Math.abs(DH[a]-h)?b:a);render()}}
/* swipe = browse */
let swiped=false;
function bindSwipe(){const c=$("#vcard");if(!c)return;let x0=null;c.onpointerdown=e=>{x0=e.clientX};c.onpointerup=e=>{if(x0===null)return;const dx=e.clientX-x0;x0=null;if(Math.abs(dx)<50)return;swiped=true;setTimeout(()=>swiped=false,50);const L=pickList();if(dx<0&&S.pick<L.length-1)S.pick++;else if(dx>0&&S.pick>0)S.pick--;render()}}
function fit(){const ph=$("#ph");if(innerWidth<=430){ph.style.transform="";return}const k=Math.min(1,(innerHeight-40)/864);ph.style.transform=k<1?`scale(${k})`:"";}
addEventListener("resize",fit);fit();
try{if(/[?&]new\b/.test(location.search))applyFresh()}catch(e){}
render();
document.addEventListener("scroll",e=>{const w=e.target;if(!w||w.id!=="wheel")return;clearTimeout(w._t);const items=[...w.querySelectorAll(".wi")],mid=w.scrollTop+w.clientHeight/2;let best=items[0],bd=1e9;items.forEach(it=>{const d=Math.abs(it.offsetTop+it.offsetHeight/2-mid);if(d<bd){bd=d;best=it}});items.forEach(it=>it.classList.toggle("on",it===best));const h=+best.dataset.h;if(S.mk){S.mk.s=h;const t=$("#mktime");if(t)t.textContent=hm(h)}},true);
setTimeout(()=>{const l=$("#load");l.classList.add("out");setTimeout(()=>l.remove(),400)},matchMedia("(prefers-reduced-motion: reduce)").matches?600:1700);
</script>
